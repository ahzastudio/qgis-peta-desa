<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- Teks 'U' Utama di Bagian Atas -->
  <text x="50" y="24" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">U</text>
  
  <!-- Jarum Panah Utara (Hitam di Kiri, Putih di Kanan) -->
  <polygon points="50,28 50,75 32,75" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="50,28 50,75 68,75" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Jarum Panah Selatan (Putih di Kiri, Hitam di Kanan) -->
  <polygon points="50,118 50,75 34,75" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="50,118 50,75 66,75" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Lingkaran Cincin Kompas -->
  <circle cx="50" cy="75" r="28" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="50" cy="75" r="23" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="2,2"/>
  
  <!-- Garis Aksial Barat-Timur -->
  <line x1="16" y1="75" x2="84" y2="75" stroke="#000000" stroke-width="1.2"/>
  <text x="10" y="79" font-family="Arial" font-size="10" font-weight="bold" text-anchor="end" fill="#000000">B</text>
  <text x="90" y="79" font-family="Arial" font-size="10" font-weight="bold" text-anchor="start" fill="#000000">T</text>
</svg>
